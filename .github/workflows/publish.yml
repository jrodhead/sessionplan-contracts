name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Build
        run: npm run build

      # Trusted publishing: npm exchanges this run's GitHub OIDC token (id-token:
      # write, above) for a short-lived publish token. No stored secret, and npm
      # adds a provenance attestation because the repo is public. The trusted
      # publisher on npmjs.com names this repo and this file (publish.yml).
      - name: Publish to npm
        run: npm publish --access public
